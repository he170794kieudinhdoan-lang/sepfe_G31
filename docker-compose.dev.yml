services:
  frontend:
    image: node:20-alpine
    container_name: sep-frontend
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:4000/api
      DOCKER: 'true'

volumes:
  frontend_node_modules:
